name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise trust
          mise install
          mise exec -- zig version

          mkdir -p dist
          for target in x86_64-linux x86_64-windows; do
            echo "==> building $target"
            mise exec -- zig build -Dtarget="$target" -Doptimize=ReleaseFast --prefix out
            name="wwm-$target"
            case "$target" in
              *windows*)
                cp out/bin/wwm.exe "dist/$name.exe"
                (cd dist && zip -q "$name.zip" "$name.exe" && rm "$name.exe")
                ;;
              *)
                cp out/bin/wwm "dist/$name"
                (cd dist && tar -czf "$name.tar.gz" "$name" && rm "$name")
                ;;
            esac
          done
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
